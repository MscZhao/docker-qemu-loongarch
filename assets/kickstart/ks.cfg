# docker-loongnix — Loongnix Server 23.3 无人值守安装 kickstart
# 模板占位符 @ROOT_PASS@ 由 entrypoint.sh 渲染后经 cpio 追加进 initrd，
# 内核参数 inst.ks=file:/ks.cfg 引用（免外部 HTTP 服务）。
# 安装源：容器内挂给 QEMU 的 DVD（scsi-cd /dev/sr0）

# ── 安装源与模式 ──────────────────────────────────────────────
cdrom
text
skipx
firstboot --disabled

# ── 本地化 ────────────────────────────────────────────────────
lang en_US.UTF-8
keyboard us
timezone Asia/Shanghai

# ── 网络与账号 ────────────────────────────────────────────────
network --bootproto=dhcp --activate
rootpw --plaintext @ROOT_PASS@
selinux --disabled
services --enabled=sshd

# ── 磁盘（UEFI + GPT）────────────────────────────────────────
zerombr
clearpart --all --initlabel --disklabel=gpt
part /boot/efi --fstype=efi --size=200
part /boot      --fstype=ext4 --size=1024
part swap       --size=2048
part /          --fstype=ext4 --grow --size=1

bootloader --timeout=1 --append="console=ttyS0,115200"

# ── 软件包（最小 + sshd）──────────────────────────────────────
%packages --ignoremissing
@core
openssh-server
-dracut-config-rescue
%end

# ── 安装后 ────────────────────────────────────────────────────
%post --log=/root/ks-post.log
systemctl enable sshd.service
systemctl enable serial-getty@ttyS0.service
%end

reboot
