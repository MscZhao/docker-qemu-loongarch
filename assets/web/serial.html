<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>串口控制台 · docker-loongnix</title>
<link rel="stylesheet" href="/vendor/xterm/xterm.css">
<style>
  :root { color-scheme: dark; }
  html, body { margin:0; height:100%; background:#0c0c10; }
  #term { position:absolute; inset:0; padding:6px; }
  #badge { position:fixed; right:10px; top:8px; z-index:10; font:12px sans-serif;
           padding:3px 10px; border-radius:10px; background:#26262e; color:#9a9aa6; }
</style>
</head>
<body>
<div id="term"></div>
<div id="badge">serial · ttyS0</div>
<script type="module">
import { Terminal } from '/vendor/xterm/xterm-esm.js';

const term = new Terminal({
  cols: 120, rows: 34, fontSize: 13,
  fontFamily: 'Menlo,Consolas,"DejaVu Sans Mono",monospace',
  cursorBlink: true, scrollback: 20000, convertEol: false,
  theme: { background: '#0c0c10' },
});
term.open(document.getElementById('term'));

let ws, retry = 0;
function connect() {
  ws = new WebSocket((location.protocol === 'https:' ? 'wss://' : 'ws://')
                     + location.host + '/serial/ws');
  ws.binaryType = 'arraybuffer';
  const badge = document.getElementById('badge');

  ws.onopen = () => { retry = 0; badge.textContent = 'serial · 已连接'; badge.style.color = '#22c55e'; };
  ws.onclose = () => { badge.textContent = 'serial · 重连中'; badge.style.color = '#f59e0b'; setTimeout(connect, Math.min(1000 * ++retry, 5000)); };
  ws.onerror = () => ws.close();
  ws.onmessage = e => term.write(e.data instanceof ArrayBuffer ? new Uint8Array(e.data) : e.data);
}

term.onData(d => ws?.readyState === WebSocket.OPEN && ws.send(d));
connect();
</script>
</body>
</html>
