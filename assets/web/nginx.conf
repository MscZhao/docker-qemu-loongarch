# docker-loongnix — 8006 单端口双视图（noVNC + 串口）入口
worker_processes 1;
pid /run/docker-loongnix/nginx.pid;
error_log /dev/stderr warn;

events { worker_connections 128; }

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log off;
    sendfile on;

    server {
        listen 8006;
        server_name _;
        root /opt/web;
        index index.html;

        # 禁用目录列举，静态文件直接命中
        # noVNC 库（vendored）与自写 vnc.html
        location /novnc/ { try_files $uri =404; }
        location = /novnc/websockify {
            proxy_pass http://127.0.0.1:5700;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_read_timeout 86400s;
        }

        # 串口 xterm 页与转发（websockify → QEMU chardev :5702）
        location /serial/ { try_files $uri =404; }
        location = /serial/ws {
            proxy_pass http://127.0.0.1:5701;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_read_timeout 86400s;
        }

        # kickstart（安装期 anaconda 经 slirp 10.0.2.2:8006 拉取）
        location = /ks.cfg { alias /storage/ks.cfg; }

        # vendored 前端库
        location /vendor/ { try_files $uri =404; }
    }
}
